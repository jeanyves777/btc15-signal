[project]
name = "btc15-signal"
version = "0.1.0"
description = "Paper-first BTC 15-minute non-return signal using public Binance data"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "httpx[socks]>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  # The IANA time zone database. The daily capital review reconciles on
  # the NEW YORK day because that is the exchange's own reset boundary,
  # and Windows ships no system tz database - without this `zoneinfo`
  # raises ZoneInfoNotFoundError. A hand-rolled DST offset would be
  # silently wrong for an hour twice a year, at a day boundary.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
btc15-signal = "btc15_signal.main:run"
btc15-backtest = "btc15_signal.backtest:run"
btc15-kalshi-backtest = "btc15_signal.kalshi_backtest:run"
btc15-reversion-backtest = "btc15_signal.reversion_backtest:run"
btc15-validate = "btc15_signal.intelligence:run"
btc15-intel = "btc15_signal.intel_query:run"
btc15-profit-test = "btc15_signal.profittest:run"
btc15-dashboard = "btc15_signal.dashboard:run"
btc15-record = "btc15_signal.recorder:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
